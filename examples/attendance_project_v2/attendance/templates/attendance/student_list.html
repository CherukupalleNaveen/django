{% extends 'attendance/base.html' %}
{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">Student List</div>
    <div class="card-body">
        <a href="{% url 'add_student' %}" class="btn btn-success mb-2">Add Student</a>
        <a href="{% url 'mark_attendance' %}" class="btn btn-warning mb-2">Mark Attendance</a>
        <table class="table table-striped">
            <thead>
                <tr><th>Roll Number</th><th>Name</th></tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr><td>{{ student.roll_number }}</td><td>{{ student.name }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
