{% extends 'attendance/base.html' %}
{% block content %}
<div class="card">
    <div class="card-header bg-info text-white">Attendance Records</div>
    <div class="card-body">
        <table class="table table-bordered">
            <thead>
                <tr><th>Name</th><th>Date</th><th>Status</th></tr>
            </thead>
            <tbody>
                {% for record in records %}
                <tr>
                    <td>{{ record.student.name }}</td>
                    <td>{{ record.date }}</td>
                    <td class="{% if record.status == 'Present' %}text-success{% else %}text-danger{% endif %}">
                        {{ record.status }}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
